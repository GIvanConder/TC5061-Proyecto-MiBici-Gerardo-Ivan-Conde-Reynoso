name: mibici-finops

services:
  api:
    image: localhost/mibici-p3-operacion:local
    build:
      context: ./serving
      dockerfile: Containerfile
    ports:
      - "127.0.0.1:${MIBICI_API_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - mibici-interna
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5

  mlflow:
    image: localhost/mibici-p3-operacion:local
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - localhost,127.0.0.1,mlflow
    ports:
      - "127.0.0.1:${MIBICI_MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    networks:
      - mibici-interna
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).close()"
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 5

networks:
  mibici-interna:
    driver: bridge

volumes:
  mlflow_data:
