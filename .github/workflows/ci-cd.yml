name: MiBici CI-CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-deploy:
    name: Tests, build and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MIBICI_API_PORT: "8000"
      MIBICI_MLFLOW_PORT: "5000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            serving/requirements.txt

      - name: Prepare evidence directory
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD > ci-evidence/git-commit.txt
          python --version > ci-evidence/python-version.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check
          python -m pip freeze > ci-evidence/dependencies.txt

      - name: Verify model integrity
        run: |
          set -o pipefail
          python scripts/verificar_integridad_ci.py \
            | tee ci-evidence/model-integrity.txt

      - name: Run automated tests
        run: |
          set -o pipefail
          python -m pytest -q \
            --junitxml=ci-evidence/pytest.xml \
            | tee ci-evidence/pytest.txt

      - name: Audit experimental reproducibility
        run: |
          mkdir -p ci-evidence
          set -o pipefail
          python scripts/auditar_reproducibilidad.py \
            --output ci-evidence/reproducibilidad.json \
            | tee ci-evidence/reproducibilidad.txt

      - name: Validate Docker Compose
        run: |
          docker version
          docker compose version
          docker compose config -q

      - name: Build inference image
        run: |
          set -o pipefail
          docker compose build api 2>&1 \
            | tee ci-evidence/build.log
          docker image inspect \
            localhost/mibici-p3-operacion:local \
            > ci-evidence/image-inspect.json

      - name: Deploy services
        run: |
          docker compose up -d \
            --no-build \
            --pull never \
            --wait \
            --wait-timeout 180
          docker compose ps

      - name: HTTP integration tests
        run: |
          set -o pipefail
          python scripts/validar_compose.py \
            | tee ci-evidence/integration.txt
          cp \
            docs/evidencias/operacion_finops/validacion_compose.json \
            ci-evidence/validacion_compose.json

      - name: Verify internal service network
        run: |
          set -o pipefail
          docker compose exec -T api python -c \
            "import urllib.request; r=urllib.request.urlopen('http://mlflow:5000/health', timeout=10); assert r.status == 200; print('API -> MLflow: HTTP', r.status)" </dev/null \
            | tee ci-evidence/internal-network.txt

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p ci-evidence
          docker compose ps -a \
            > ci-evidence/compose-status.txt 2>&1 || true
          docker compose logs --no-color \
            > ci-evidence/compose.log 2>&1 || true

      - name: Stop temporary deployment
        if: always()
        run: |
          docker compose down -v --remove-orphans

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mibici-ci-evidence
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: warn
